# Aider config — routed through the local rotating gateway, not a single key.
#
# WHY: this used to pin `groq/openai/gpt-oss-120b` against one unrotated key, so
# a single 429 ended the run and the other pools were never reached. Pinning the
# default to one key is the failure this file exists to avoid — it dies the same
# way whether that key is rate-limited or revoked.
#
# bin/ai_gateway.py is an OpenAI-compatible endpoint that walks the vault pools
# in AUTO_CHAIN order (groq, swarms, then the paid and flaky free tiers) and
# rotates on rate limits. bin/gateway-ensure and bin/vault-launch start it on
# demand, so `aider` alone is enough; it does not need to be started by hand.
#
# Re-probed 2026-09-16 with one real chat call per pool: groq, swarms and
# openrouter answer; mistral, orcarouter, cerebras, bazaar, puter, openai,
# zenmux, gemini and sageox do not — for account or upstream reasons, not
# because the keys are wrong. Per-pool detail: docs/PROVIDER_ENDPOINTS.md.
#
# Keys are never hardcoded here; they are read from ~/.concierge/vault.json by
# the gateway process.
model: openai/default
weak-model: openai/default
openai-api-base: http://127.0.0.1:7071/v1/auto
openai-api-key: local-gateway
auto-commits: false
gitignore: false
dark-mode: true
# Don't auto-add every file — be explicit.
auto-lint: false

# Scout Empire — 40 self-evolving SKILL.md scouts
# When user mentions scouts/foreman/desired_settings, read projects/ScoutEmpire/cli/SKILL_HINT.md
read: projects/ScoutEmpire/cli/SKILL_HINT.md
