# Aider config — routed through the local rotating gateway, not a single key.
#
# WHY: this used to pin `groq/openai/gpt-oss-120b` against one unrotated key, so
# a single 429 ended the run and the other pools were never reached. Pinning the
# default to one key is the failure this file exists to avoid — it dies the same
# way whether that key is rate-limited or revoked.
#
# bin/ai_gateway.py is an OpenAI-compatible endpoint that walks the vault pools
# in AUTO_CHAIN order and rotates on rate limits. bin/gateway-ensure and
# bin/vault-launch start it on demand, so `aider` alone is enough; it does not
# need to be started by hand.
#
# FREE ONLY, as of 2026-09-25. This used to say the chain walked "the paid and
# flaky free tiers" last, which was true and is no longer the intent: the chain
# now refuses any pool not declared free in ~/.config/ai/policy.toml, so no
# aider run can bill you. That file is the answer to "which providers can this
# reach and why not the others" — query it live at http://127.0.0.1:7071/policy.
#
# Re-probed 2026-09-25 with one real chat call per pool: groq 11/11 keys live;
# openrouter and mistral are free but rate-limited; puter, cerebras, bazaar,
# swarms and orcarouter all answer 402 and are excluded; zenmux 403; sageox 502.
# Per-pool detail: docs/PROVIDER_ENDPOINTS.md.
#
# Dead keys are reaped out from under this config, not just cooled down:
# `python3 bin/ai_gateway_reap.py` probes every FREE pool key-by-key and writes
# verdicts the gateway honours. `python3 bin/ai_trace.py rotation` shows which
# key actually served each call.
#
# Keys are never hardcoded here; they are read from ~/.concierge/vault.json by
# the gateway process.
auto-commits: false
gitignore: false
dark-mode: true
# Don't auto-add every file — be explicit.
auto-lint: false

# Scout Empire — 40 self-evolving SKILL.md scouts
