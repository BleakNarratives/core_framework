# model / weak-model/openai-api-base are MANAGED by bin/loadout (loadout 'recruiter'). Do not hand-edit; `bin/loadout emit` rewrites them.
#
# The class pins 'groq::openai/gpt-oss-120b', but that pin CANNOT be expressed
# here: litellm parses and strips the vendor prefix before the request
# is built, so no spelling of the model id survives the trip to the
# gateway. `openai/default` hands model choice back to the gateway,
# which resolves it per pool with rotation and fallthrough. See
# bin/loadout aider_target() for the three spellings that all 404.

model: openai/default
weak-model: openai/default
openai-api-base: http://127.0.0.1:7071/v1/auto
openai-api-key: local-gateway

