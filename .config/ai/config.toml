# The ONE config for every local AI CLI and API call.
#
# Consumers:
#   bin/ai        headless + interactive front-end (this config)
#   bin/errfix    traceback fixer
#   bin/anchor/*  persistent-state agent
#   bin/ai_gateway.py   transport; it reads keys from ~/.concierge/vault.json,
#                       never from here
#
# Point a CLI at the gateway by giving it http://127.0.0.1:7071/v1/auto as its
# OpenAI base URL. Nothing should hold a provider key except the gateway.

# Gateway root (ai_lib appends /v1/... itself). The trailing /v1/auto form is
# what OpenAI-shaped CLIs like aider/vibe want.
base_url = "http://127.0.0.1:7071"

# Used when no model is named.
default_model = "auto"

# Named presets. Values are gateway model strings:
#   "auto"            -> walk the live provider chain
#   "provider::model" -> pin one provider (path-routed by the gateway)
[models]
# >>> loadout presets (bin/loadout) — do not hand-edit >>>
# Regenerate: bin/loadout emit
operator = "groq::openai/gpt-oss-120b"
operator_secondary = "auto"
recruiter = "groq::openai/gpt-oss-120b"
recruiter_secondary = "auto"
# <<< loadout presets <<<
default = "auto"
auto = "auto"
# Live pools only, per docs/PROVIDER_ENDPOINTS.md (re-probed 2026-09-16):
# groq, swarms and openrouter answer; mistral (429), openai (unpaid),
# gemini-direct (upstream 503) and cerebras (402) do not, so no preset pins
# them. Prefer `auto` or a pinned live pool below.
fast = "groq::openai/gpt-oss-120b"
code = "openrouter::nvidia/nemotron-3-super-120b-a12b:free"
# swarms fronts 1908 model ids, including the Gemini route that answers while
# the Google key is upstream-503. Used for both heavy reasoning and long/
# Gemini-shaped context until a direct Gemini key works again.
big = "swarms::gemini/gemini-3.1-pro-preview"
gemini = "swarms::gemini/gemini-3.1-pro-preview"

# Answer style for headless callers (bin/ai --headless, errfix, future agents).
[headless]
# Keep replies terse so a traceback fix can be applied without reading an essay.
system = "You are a terse senior engineer. Answer with the fix, not a lecture. Prefer exact code and exact commands."
max_chars = 6000

# ── provenance traces ──────────────────────────────────────────────────
# The gateway appends one JSONL record per call to
# ~/.local/state/ai/traces/YYYY-MM-DD.jsonl, then `ai --spend` reads it back.
#
# Redaction runs INSIDE record(), on the way to disk -- there is no path that
# writes raw prompt text. A trace already on disk cannot be un-leaked, so the
# filter is not a cleanup pass.
#   off       write nothing at all
#   redacted  (default) strip PII and credentials from prompt/response
#   raw       store unredacted -- debug only, puts customer data on disk
[trace]
enabled = true
capture = "redacted"
# dir = "~/.local/state/ai/traces"
# max_field_chars = 8000

# Optional real rates so cost stops reporting "unknown".
# Substring-matched against the model id, { input, output } per 1M tokens.
# Free tiers (groq, cerebras, gemini, puter, any ":free" model) are priced 0.0
# automatically -- only add entries for providers you actually pay.
# [prices]
# "deepseek-chat" = [0.27, 1.10]
