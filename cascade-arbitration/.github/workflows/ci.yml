name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # No install step on purpose: the arbiter must work with nothing but the
        # standard library, and the tests assert that. Installing first would
        # hide a regression by supplying `requests` to bench.py.
        run: python -m unittest test_cascade -v

      - name: Smoke-test the CLI entry points
        run: |
          python demo.py --host-gpu
          python bench.py --no-ollama

      - name: Verify the package builds
        run: |
          python -m pip install --upgrade build
          python -m build
