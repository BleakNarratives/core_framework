[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-arbitration"
version = "0.1.0"
description = "Decide per request whether local LLM inference is eligible, instead of discovering it with a thrash."
readme = "README.md"
authors = [{ name = "BleakNarratives" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["llm", "routing", "cascade", "ollama", "edge", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

# Intentionally zero runtime dependencies. The bench harness uses `requests`
# only for the optional local Ollama probe, and degrades to a skip without it.
dependencies = []

[project.optional-dependencies]
probe = ["requests>=2.25"]

[project.scripts]
cascade-bench = "bench:main"
cascade-demo = "demo:main"

[project.urls]
Issues = "https://github.com/BleakNarratives/cascade-arbitration/issues"

[tool.setuptools]
py-modules = ["cascade", "bench", "demo"]
