# daemon/config.yaml — scout-foreman
skill: scout-foreman
oomf_level: 2
interval: "15m"   # cron shorthand; expand to systemd timer / crontab in prod
feeds: [scout_health, memory_footprint, secret_rotation, sweep_results]
target_domains: ["local.internal"]
oracle: { mode: strict }
entitlements:
  active: [base]        # base | premium (retainer)
  premium_note: "Set license.key to unlock private high-frequency feeds."
license:
  key: ""               # offline nonce — author-issued
