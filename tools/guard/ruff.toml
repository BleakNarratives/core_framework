# tools/guard/ruff.toml — the lint ratchet.
#
# Used by tools/guard/pre_commit.py (advisory) and available for manual runs:
#   ruff check src tools tests --config tools/guard/ruff.toml
#
# The select list is deliberately the *real-bug* subset: undefined names,
# unused imports/vars, bad placeholders, syntax. These should never grow.
# The commented block below is a target list (typing modernization, silent
# exceptions, timezone bugs) for a later ratchet — enabling it now would flag
# ~1,600 sites in one shot, which helps no one.

target-version = "py311"

[lint]
select = [
  "E9",   # syntax / IO errors
  "F63",  # invalid print/syntax in string
  "F7",   # syntax errors in statements
  "F82",  # undefined names
  "F401", # unused import
  "F841", # unused local variable
]

# The cleanup backlog, measured 2026-09-30 over src/ tools/ tests/.
# Enable these one at a time, fix the findings, then keep the rule on:
#   UP006  (402) non-pep585-annotation        — `List[X]` -> `list[X]`
#   BLE001 (242) blind-except                 — 409 sites silently swallow errors
#   S110   (112) try-except-pass
#   UP045  (145) non-pep604-annotation-optional
#   E722    (55) bare-except
#   C901    (20) complex-structure (>15)
#   DTZ005  (38) datetime.now() without tz
#   PLW1510 (30) subprocess.run without check=
